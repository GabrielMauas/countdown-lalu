<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cd-wrap {
      text-align: center;
      padding: 2rem 1rem;
      font-family: 'Motor', 'Oswald', sans-serif;
    }
    .cd-title {
      color: #0833a2;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 1.2rem;
    }
    .cd-box {
      display: inline-flex;
      border: 2.5px solid #0833a2;
      padding: clamp(0.8rem, 3vw, 1.8rem) clamp(1rem, 4vw, 2.5rem);
      gap: clamp(0.8rem, 4vw, 2.8rem);
      align-items: center;
    }
    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .cd-num {
      color: #0833a2;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      line-height: 1;
      min-width: 2ch;
      text-align: center;
    }
    .cd-label {
      color: #0833a2;
      font-size: clamp(0.45rem, 1.5vw, 0.68rem);
      font-weight: 700;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="cd-wrap">
    <div class="cd-title">COUNTDOWN</div>
    <div class="cd-box">
      <div class="cd-unit">
        <span class="cd-num" id="cd-days">00</span>
        <span class="cd-label">DÍAS</span>
      </div>
      <div class="cd-unit">
        <span class="cd-num" id="cd-hours">00</span>
        <span class="cd-label">HORAS</span>
      </div>
      <div class="cd-unit">
        <span class="cd-num" id="cd-mins">00</span>
        <span class="cd-label">MINUTOS</span>
      </div>
      <div class="cd-unit">
        <span class="cd-num" id="cd-secs">00</span>
        <span class="cd-label">SEGUNDOS</span>
      </div>
    </div>
  </div>

  <script>
    var target = new Date('2026-09-13T00:00:00');
    function pad(n){ return String(n).padStart(2,'0'); }
    function tick(){
      var diff = target - new Date();
      if(diff < 0) diff = 0;
      document.getElementById('cd-days').textContent  = pad(Math.floor(diff / 86400000));
      document.getElementById('cd-hours').textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById('cd-mins').textContent  = pad(Math.floor((diff % 3600000) / 60000));
      document.getElementById('cd-secs').textContent  = pad(Math.floor((diff % 60000) / 1000));
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
